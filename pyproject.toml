[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ksp-control"
version = "0.1.0"
description = "Hexagonal-architecture Python tools to monitor and control Kerbal Space Program through kRPC."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # The kRPC client MUST match the kRPC mod installed in KSP. Version 0.8.0
    # changed the wire protocol, so clients and servers from different
    # release lines cannot talk to each other. Bump this together with the mod.
    "krpc==0.8.0",
    "flask>=3.0",
    # Invented people's names for the relay probes ("CA-40-Muna-01 John Doe").
    "faker>=30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ksp-economy-monitor = "ksp_control.entrypoints.economy_monitor:main"
ksp-recover = "ksp_control.entrypoints.recover_vessels:main"
ksp-part-tests = "ksp_control.entrypoints.part_tests:main"
ksp-tourism = "ksp_control.entrypoints.tourism:main"
ksp-constellation = "ksp_control.entrypoints.constellation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ksp_control.adapters.web" = ["static/*", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
